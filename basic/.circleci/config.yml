# A minimal CircleCI configuration using the Cypress CircleCI orb.
# https://on.cypress.io/circleci-orb
#
# This is a documentation example, not a live workflow. The tests for this
# repository run in GitHub Actions, see .github/workflows/
version: 2.1

orbs:
  # use the Cypress orb from the CircleCI registry
  # https://github.com/cypress-io/circleci-orb/releases
  cypress: cypress-io/cypress@6.1.0

jobs:
  test:
    executor: cypress/default
    steps:
      # installs npm dependencies and the Cypress binary, and caches both
      - cypress/install:
          post-install: 'npm run build'
      # starts the local server, waits for it, then runs the tests
      - cypress/run-tests:
          start-command: 'npm start'
          cypress-command: 'npx cypress run'

workflows:
  build:
    jobs:
      - test
