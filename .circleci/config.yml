# The Cypress tests for this repository run in GitHub Actions.
# See .github/workflows/ for the live test workflows.
#
# basic/.circleci/config.yml is the example of running Cypress on CircleCI
# with the Cypress orb. https://on.cypress.io/circleci-orb
#
# This configuration publishes the npm package with semantic-release, and uses
# the orb only for its executor.

version: 2.1
orbs:
  # use Cypress orb from CircleCI registry
  cypress: cypress-io/cypress@6.1.0 # https://github.com/cypress-io/circleci-orb/releases

jobs:
  release:
    executor:
      name: cypress/default
      node-version: '24.21.0'
    steps:
      - checkout
      - run: npm ci
      # npm trusted publishing: npm exchanges this OIDC token for a short-lived
      # publish token, so no NPM_TOKEN is needed. The token is requested in the
      # same step as the release because exports do not persist across steps.
      # https://docs.npmjs.com/trusted-publishers
      - run:
          name: Release
          command: |
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            npx semantic-release@25.0.3

  # Publishes a no-op prerelease under the dev dist-tag, never latest, so that
  # npm trusted publishing is exercised without releasing anything real.
  publish-dev:
    executor:
      name: cypress/default
      node-version: '24.21.0'
    steps:
      - checkout
      - run: npm version "0.0.0-dev.<< pipeline.number >>" --no-git-tag-version
      - run:
          name: Publish dev tag
          command: |
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            npm publish --tag dev

workflows:
  publish-dev:
    jobs:
      - publish-dev:
          context: org-npm-credentials
          filters:
            branches:
              only:
                - dev-publish
  publish:
    jobs:
      - release:
          context: org-npm-credentials
          filters:
            branches:
              only:
                - master
