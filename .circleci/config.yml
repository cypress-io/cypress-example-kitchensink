# testing using CircleCI orb
# see https://on.cypress.io/circleci-orb

version: 2.1
orbs:
  # use Cypress orb from CircleCI registry
  cypress: cypress-io/cypress@6.1.0 # https://github.com/cypress-io/circleci-orb/releases
  win: circleci/windows@5.1.1 # https://circleci.com/developer/orbs/orb/circleci/windows
  browser-tools: circleci/browser-tools@2.4.2 # https://circleci.com/developer/orbs/orb/circleci/browser-tools

executors:
  mac:
    macos:
      xcode: "27.0"
    resource_class: m4pro.medium

jobs:
  win-test-chrome:
    working_directory: ~/app
    executor:
      name: win/default
      size: medium
      shell: bash.exe
    steps:
      - checkout
      - run:
          name: Install Node.js
          command: |
            nvm --version
            nvm install 24.21.0
            nvm use 24.21.0
      - restore_cache:
          key: dependencies-v1-{{ arch }}-{{ .Branch }}-{{ checksum "package-lock.json" }}

      # install Chrome browser on Windows machine using Chocolatey
      # https://chocolatey.org/packages/GoogleChrome
      # The package downloads from a floating URL that Google updates in place, so its
      # published checksum goes stale on each Chrome release. There is no stable hash to
      # pin, which is why verification is skipped rather than fixed.
      - run: choco install googlechrome --ignore-checksums -y
      - run: npm ci
      - run: npm run cy:verify
      - run: npm run cy:info

      - save_cache:
          key: dependencies-v1-{{ arch }}-{{ .Branch }}-{{ checksum "package-lock.json" }}
          paths:
            # could not use environment variables for some reason
            - C:\Users\circleci\AppData\Local\Cypress\Cache
            - C:\Users\circleci\AppData\Roaming\npm-cache

      - run:
          name: 'Start server'
          command: npm run start
          background: true

      - run:
          name: 'Run Cypress tests'
          command: npm run e2e:record:chrome
          no_output_timeout: '1m'
      - store_artifacts:
          path: cypress\screenshots

  win-test-firefox:
    working_directory: ~/app
    executor:
      name: win/default
      size: medium
      shell: bash.exe
    steps:
      - checkout
      - run:
          name: Install Node.js
          command: |
            nvm --version
            nvm install 24.21.0
            nvm use 24.21.0
      - restore_cache:
          key: dependencies-v1-{{ arch }}-{{ .Branch }}-{{ checksum "package-lock.json" }}

      # install Firefox browser on Windows machine using Chocolatey
      # https://chocolatey.org/packages/Firefox
      - run: choco install firefox -y
      - run: npm ci
      - run: npm run cy:verify
      - run: npm run cy:info

      - save_cache:
          key: dependencies-v1-{{ arch }}-{{ .Branch }}-{{ checksum "package-lock.json" }}
          paths:
            # could not use environment variables for some reason
            - C:\Users\circleci\AppData\Local\Cypress\Cache
            - C:\Users\circleci\AppData\Roaming\npm-cache

      - run:
          name: 'Start server'
          command: npm run start
          background: true

      - run:
          name: 'Run Cypress tests'
          command: npm run e2e:record:firefox
          no_output_timeout: '1m'
      - store_artifacts:
          path: cypress\screenshots

  mac-test-chrome:
    executor: mac
    steps:
      - run:
          name: Install Node.js
          command: |
            nvm install 24.21.0
            nvm use 24.21.0
            nvm alias default 24.21.0
      - browser-tools/install_chrome
      - cypress/install:
          post-install: 'npm run build'
      - run: npx cypress cache path
      - run: npx cypress cache list
      - run: npx cypress info
      - cypress/run-tests:
          start-command: 'npm run start'
          cypress-command: 'npx cypress run --browser chrome --record'

  mac-test-firefox:
    executor: mac
    steps:
      - run:
          name: Install Node.js
          command: |
            nvm install 24.21.0
            nvm use 24.21.0
            nvm alias default 24.21.0
      - browser-tools/install_firefox
      - cypress/install:
          post-install: 'npm run build'
      - run: npx cypress cache path
      - run: npx cypress cache list
      - run: npx cypress info
      - cypress/run-tests:
          start-command: 'npm run start'
          cypress-command: 'npx cypress run --browser firefox --record'

  linux-test-chrome:
    # runs on 2 machines using Chrome browser
    parallelism: 2
    executor:
      name: cypress/default
      node-version: '24.21.0'
    steps:
      - browser-tools/install_chrome
      - cypress/install:
          post-install: 'npm run build'
      # inspect and print Cypress cache, browser and version information
      - run: npx cypress cache path
      - run: npx cypress cache list
      - run: npx cypress info
      - run: npx cypress version
      - run: npx cypress version --component package
      - run: npx cypress version --component binary
      - run: npx cypress version --component electron
      - run: npx cypress version --component node
      - cypress/run-tests:
          start-command: 'npm run start'
          cypress-command: 'npx cypress run --browser chrome --record --parallel --group 2x-chrome on CircleCI'

  linux-test-firefox:
    # runs on 2 machines using Firefox browser
    parallelism: 2
    executor:
      name: cypress/default
      node-version: '24.21.0'
    steps:
      - browser-tools/install_firefox
      - cypress/install:
          post-install: 'npm run build'
      - run: npx cypress info
      - cypress/run-tests:
          start-command: 'npm run start'
          cypress-command: 'npx cypress run --browser firefox --record --parallel --group 2x-firefox on CircleCI'

  release:
    executor:
      name: cypress/default
      node-version: '24.21.0'
    steps:
      - checkout
      - run: npm ci
      - run: npx semantic-release@25.0.3

workflows:
  win-build:
    jobs:
      - win-test-chrome
      - win-test-firefox

  mac-build:
    jobs:
      - mac-test-chrome
      - mac-test-firefox

  linux-build:
    max_auto_reruns: 3
    jobs:
      - linux-test-chrome
      - linux-test-firefox

      - release:
          context: org-npm-credentials
          filters:
            branches:
              only:
                - master
          requires:
            - linux-test-chrome
            - linux-test-firefox
