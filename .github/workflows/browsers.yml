# GitHub Actions
# https://docs.github.com/en/actions/using-workflows
#
# Chrome and Firefox coverage on Linux and Windows, recorded to Cypress Cloud.
#
# The Linux jobs run in a Cypress Docker image so the browser major versions
# are pinned. A runner image tracks whatever Chrome and Firefox ship that
# month, which drifts ahead of the versions a given Cypress release supports.
# Windows runners cannot use a container, so those jobs take the browsers the
# runner image provides.
#
# Electron coverage lives in using-action.yml, parallel.yml and single.yml.
name: Browsers

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

jobs:
  linux:
    name: Linux ${{ matrix.browser }} (${{ matrix.recording-job }})
    # Recording needs a projectId and Record Key, which a fork does not have.
    # Skip when the code comes from a fork, and when this workflow itself runs
    # in a fork of this repository.
    if: github.repository_owner == 'cypress-io' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    strategy:
      # when one test fails, DO NOT cancel the other
      # jobs, because this will kill Cypress processes
      # leaving the Cypress Cloud dashboard hanging ...
      # https://github.com/cypress-io/github-action/issues/48
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
        # Run 2 copies of each browser job in parallel.
        # Cypress Cloud load-balances the specs across them.
        recording-job: [1, 2]
    # Use a Cypress Docker image with browsers pre-installed
    # to ensure that the tests run in the same consistent environment across each parallel run
    container:
      image: cypress/browsers:24.20.0
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Run tests
        uses: cypress-io/github-action@09090944bd8aaa2a517cefb6e38bf1aae336b42b # v7.4.3
        timeout-minutes: 10
        with:
          build: npm run build
          start: npm start
          browser: ${{ matrix.browser }}
          record: true
          parallel: true
          group: Linux ${{ matrix.browser }}
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.dashboardRecordKey }}

  windows:
    name: Windows ${{ matrix.browser }}
    # See the note on the linux job above.
    if: github.repository_owner == 'cypress-io' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Run tests
        uses: cypress-io/github-action@09090944bd8aaa2a517cefb6e38bf1aae336b42b # v7.4.3
        # a single container runs the whole suite here, and the Windows runner
        # is the slowest to install the Cypress binary
        timeout-minutes: 15
        with:
          build: npm run build
          start: npm start
          browser: ${{ matrix.browser }}
          record: true
          group: Windows ${{ matrix.browser }}
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.dashboardRecordKey }}

  # One stable result for this workflow, so branch protection can require a
  # single name instead of every matrix job. It runs even when the jobs above
  # are skipped, which is what happens for a pull request from a fork.
  gate:
    name: Browsers
    if: always()
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Check the test jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
