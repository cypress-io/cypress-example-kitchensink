name: Chrome Docker

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

jobs:
  # run Chrome inside a Docker container
  chrome:
    name: Chrome (Docker)
    runs-on: ubuntu-26.04
    # https://github.com/cypress-io/cypress-docker-images
    container: cypress/browsers:24.22.0
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1 # v7.0.1
      - name: Chrome
        uses: cypress-io/github-action@bc982daf1fc26474fa0cf2c355d6c910616ce411 # v7.4.7
        timeout-minutes: 10
        with:
          build: npm run build
          start: npm start
          browser: chrome
